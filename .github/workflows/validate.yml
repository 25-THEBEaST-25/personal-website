name: Validate HTML

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  html-validate:
    name: Lint HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run html-validate on all HTML files
        run: npx --yes html-validate "**/*.html"
